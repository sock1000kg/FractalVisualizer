<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Fractal Visualizer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" href="./res/blue.png" />
</head>
<body>
    <div id="app">
        <canvas id="canvas"></canvas>

        <!-- Top-left column: the controls bar, the equation line and (on phones) the inset.
             A column keeps the formula right below the bar however many rows the bar wraps onto. -->
        <div id="topLeft">
            <div id="controls">
                <label for="savedSettingsSelect">Saves</label> <select id="savedSettingsSelect">
                    <option value="" disabled selected>-- Saved Settings --</option>
                </select>
                <label for="fractalSelect">Type</label> <select id="fractalSelect"></select>
                <div class="inputs" id="zoomBox">
                    <label for="zoomInput">Zoom ×</label> <input type="text" inputmode="decimal" id="zoomInput" value="1"/>
                </div>
                <button id="bwToggle">B&W</button>
                <button id="simpleToggle">Simple</button>
                <button id="view3dToggle">3D</button>
                <button id="pauseToggle">Pause (P)</button>
                <button id="downloadToggle">Download</button>
                <button id="saveToggle">Save</button>
                <button id="deletePresetToggle">Delete</button>
            </div>

            <!-- Equation of the main view, with live values -->
            <div id="formula"></div>
            <!-- shown when the zoom passes what the current renderer can draw accurately -->
            <div id="precisionWarning" class="hidden">⚠ precision limit: image may look blocky</div>

            <!-- Preview inset: the partner of the current type (Mandelbrot types: the Julia set
                 under the cursor; Julia types: the Mandelbrot set with a crosshair at c).
                 Clicking or tapping the box jumps into what it shows. -->
            <div id="previewBox" class="hidden">
                <canvas id="preview" width="240" height="160"></canvas>
                <div id="previewMarker" class="marker hidden"></div>
                <div id="previewLabel"></div>
            </div>
        </div>

        <!-- "c" crosshair: where a Julia -> Mandelbrot jump came from (positioned by JS) -->
        <div id="cMarker" class="marker hidden"><span>c</span></div>
        <!-- "p" crosshair: the point a Mandelbrot-type preview is pinned to (positioned by JS) -->
        <div id="pinMarker" class="marker hidden"><span>p</span></div>

        <!-- short message at the bottom (shown when 3D fails to start) -->
        <div id="toast" class="hidden"></div>

        <div id="advanced">
            <details>
                    <summary>Advanced Controls</summary>
    
                    <div class="inputs">
    
                        <label for="cReInput">MouseX: <input type="number" id="cReInput" step="0.01" value="-0.7"></label>
                        <label for="cImInput">MouseY: <input type="number" id="cImInput" step="0.01" value="0.27015"></label>
    
                        <label for="hueBaseInput">Hue Base: 
                            <input type="range" id="hueBaseInput" value="0" min="0" max="1000" step="1">
                            <span id="hueBaseValue">0</span>
                        </label>
                        <label for="hueSpeedInput">Hue Speed: 
                            <input type="range" id="hueSpeedInput" value="10" min="1" max="500" step="1">
                            <span id="hueSpeedValue">10</span>
                        </label>
                        <label for="iterInput">Iterations:
                            <input type="range" id="iterInput" value="288" min="0" max="1000" step="1">
                            <span id="iterValue">60</span>
                        </label>
                        <label for="iterAutoToggle" class="checkbox">
                            <input type="checkbox" id="iterAutoToggle">
                            <span>Auto iterations</span>
                        </label>
                        <label for="smoothInput">Smoothness:
                            <input type="range" id="smoothInput" value="100" min="0" max="100" step="1">
                            <span id="smoothValue">100</span>
                        </label>
                        <label for="powerInput" id="powerLabel">Power:
                            <input type="range" id="powerInput" value="2" min="2" max="8" step="0.1">
                            <span id="powerValue">2.0</span>
                        </label>
                        <label for="czInput" id="czLabel" class="hidden">c z:
                            <input type="range" id="czInput" value="0" min="-1.5" max="1.5" step="0.01">
                            <span id="czValue">0.00</span>
                        </label>
                        <label for="scaleInput" id="scaleLabel" class="hidden">Scale:
                            <input type="range" id="scaleInput" value="-1.5" min="-3" max="3" step="0.05">
                            <span id="scaleValue">−1.50</span>
                        </label>
                        <label for="kleinSizeInput" id="kleinSizeLabel" class="hidden">Box size:
                            <input type="range" id="kleinSizeInput" value="1" min="0.8" max="1.15" step="0.005">
                            <span id="kleinSizeValue">1.000</span>
                        </label>
                        <label for="heightInput" id="heightLabel" class="hidden">Height:
                            <input type="range" id="heightInput" value="35" min="0" max="100" step="1">
                            <span id="heightValue">35</span>
                        </label>
                        <button id="resetCamToggle" class="hidden">Reset camera</button>
                        <small id="camMoveHint" class="hidden">Ctrl + middle-drag: move camera</small>
                        <small id="flyHint" class="hidden">WASD/arrows move · Q/E down/up · drag look · wheel speed · Shift boost</small>
                        <label for="previewToggle" class="checkbox" id="previewToggleLabel">
                            <input type="checkbox" id="previewToggle" checked>
                            <span id="previewToggleText">Julia preview</span>
                        </label>
                        <label for="saturationInput">Saturation:
                            <input type="range" id="saturationInput" value="70" min="0" max="100" step="1">
                            <span id="saturationValue">70</span>
                        </label>
                        <label for="lightnessInput">Lightness:
                            <input type="range" id="lightnessInput" value="50" min="0" max="100" step="1">
                            <span id="lightnessValue">50</span>
                        </label>
                    </div>
            </details>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
